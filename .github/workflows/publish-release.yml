name: Publish immutable release

on:
  push:
    branches:
      - main
    paths:
      - "release-manifests/*.json"
  workflow_dispatch:
    inputs:
      manifest:
        description: "Release manifest path, for recovery of the same commit only"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: codex-kimi-bridge-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Read and validate the release manifest
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            manifest="$INPUT_MANIFEST"
          else
            manifest="$(git diff-tree --no-commit-id --name-only --diff-filter=AM -r "$GITHUB_SHA" | grep -E '^release-manifests/v[^/]+\.json$' || true)"
            count="$(printf '%s\n' "$manifest" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [[ "$count" != "1" ]]; then
              echo "A release commit must add exactly one JSON manifest; found $count." >&2
              exit 1
            fi
          fi

          case "$manifest" in
            release-manifests/v*.json) ;;
            *) echo "Unsafe manifest path: $manifest" >&2; exit 1 ;;
          esac
          [[ -f "$manifest" ]] || { echo "Manifest not found: $manifest" >&2; exit 1; }

          version="$(jq -er '.version' "$manifest")"
          tag="$(jq -er '.tag' "$manifest")"
          title="$(jq -er '.title' "$manifest")"
          prerelease="$(jq -er '.prerelease' "$manifest")"
          target_commit="$(jq -r '.target_commit // empty' "$manifest")"
          retry_failed_draft="$(jq -r '.retry_failed_draft // false' "$manifest")"
          notes="${manifest%.json}.md"

          [[ -n "$target_commit" ]] || target_commit="$GITHUB_SHA"

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$tag" == "v$version" ]]
          [[ "$manifest" == "release-manifests/$tag.json" ]]
          [[ "$prerelease" == "true" ]]
          [[ "$target_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$retry_failed_draft" == "true" || "$retry_failed_draft" == "false" ]]
          [[ -s "$notes" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]

          cargo_version="$(awk -F '"' '/^version = / { print $2; exit }' rust/Cargo.toml)"
          [[ "$cargo_version" == "$version" ]]
          grep -Fq "EXPECTED_VERSION=\"$version\"" install/install-codex-kimi-bridge.command

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "target_commit=$target_commit" >> "$GITHUB_OUTPUT"
          echo "retry_failed_draft=$retry_failed_draft" >> "$GITHUB_OUTPUT"

      - name: Check out the exact tagged source
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.target_commit }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]]; then
            git fetch origin "$RELEASE_COMMIT"
            git checkout --detach "$RELEASE_COMMIT"
          fi
          [[ "$(git rev-parse HEAD)" == "$RELEASE_COMMIT" ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal \
            --component rustfmt \
            --target aarch64-apple-darwin \
            --target x86_64-apple-darwin

      - name: Test Rust and Node implementations
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.97.1 cargo fmt --manifest-path rust/Cargo.toml --check
          rustup run 1.97.1 cargo test --manifest-path rust/Cargo.toml --locked --all-targets
          node_major="$(node -p 'Number(process.versions.node.split(".")[0])')"
          [[ "$node_major" -ge 20 ]]
          npm --prefix node run check
          npm --prefix node test
          npm --prefix node run smoke

      - name: Build and package macOS release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          rustup run 1.97.1 cargo build --manifest-path rust/Cargo.toml --locked --release --target aarch64-apple-darwin
          rustup run 1.97.1 cargo build --manifest-path rust/Cargo.toml --locked --release --target x86_64-apple-darwin
          mkdir -p "$RUNNER_TEMP/release-assets"
          bash scripts/package-release.sh "$RELEASE_VERSION" "$RUNNER_TEMP/release-assets"

      - name: Create or verify the annotated tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.target_commit }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tagged_commit="$(git rev-list -n 1 "$tag")"
            [[ "$tagged_commit" == "$RELEASE_COMMIT" ]] || {
              echo "Tag $tag already points to a different commit." >&2
              exit 1
            }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$RELEASE_COMMIT" -m "codex-kimi-bridge $RELEASE_VERSION"
            git push origin "refs/tags/$tag"
          fi

      - name: Create a draft prerelease and upload assets once
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
          RETRY_FAILED_DRAFT: ${{ steps.release.outputs.retry_failed_draft }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          existing_json="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -c --arg tag "$tag" '.[] | select(.tag_name == $tag)' | head -n 1)"
          if [[ -n "$existing_json" ]]; then
            if [[ "$RETRY_FAILED_DRAFT" != "true" || "$(jq -r '.draft' <<< "$existing_json")" != "true" ]]; then
              echo "A GitHub Release already exists for $tag; refusing to overwrite it." >&2
              exit 1
            fi
            existing_id="$(jq -r '.id' <<< "$existing_json")"
            existing_assets="$(jq -c '.assets // []' <<< "$existing_json")"
            [[ "$(jq 'length' <<< "$existing_assets")" == "6" ]]
            [[ "$(jq '[.[].state == "uploaded"] | all' <<< "$existing_assets")" == "true" ]]
            gh release delete "$tag" --yes
            [[ -z "$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag) | .id' | head -n 1)" ]]
          fi

          gh release create "$tag" "$RUNNER_TEMP"/release-assets/* \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES" \
            --verify-tag \
            --draft \
            --prerelease \
            --latest=false

      - name: Verify every draft asset digest and size
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          release_json=""
          for attempt in {1..30}; do
            release_json="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -c --arg tag "$tag" '.[] | select(.tag_name == $tag)' | head -n 1)"
            if [[ -n "$release_json" ]] \
              && [[ "$(jq -r '.draft' <<< "$release_json")" == "true" ]] \
              && [[ "$(jq -r '.prerelease' <<< "$release_json")" == "true" ]] \
              && [[ "$(jq '.assets | length' <<< "$release_json")" == "6" ]] \
              && [[ "$(jq '[.assets[] | (.state == "uploaded" and (((.digest // "") | startswith("sha256:"))))] | all' <<< "$release_json")" == "true" ]]; then
              break
            fi
            sleep 2
          done
          [[ -n "$release_json" ]]
          [[ "$(jq -r '.draft' <<< "$release_json")" == "true" ]]
          [[ "$(jq -r '.prerelease' <<< "$release_json")" == "true" ]]
          assets_json="$(jq -c '.assets // []' <<< "$release_json")"

          local_count="$(find "$RUNNER_TEMP/release-assets" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')"
          remote_count="$(jq 'length' <<< "$assets_json")"
          [[ "$local_count" == "6" && "$remote_count" == "$local_count" ]]

          for local_asset in "$RUNNER_TEMP"/release-assets/*; do
            name="$(basename "$local_asset")"
            local_size="$(stat -f '%z' "$local_asset")"
            local_digest="sha256:$(shasum -a 256 "$local_asset" | awk '{print $1}')"
            matches="$(jq --arg name "$name" '[.[] | select(.name == $name)] | length' <<< "$assets_json")"
            [[ "$matches" == "1" ]]
            remote_size="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .size' <<< "$assets_json")"
            remote_digest="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .digest // empty' <<< "$assets_json")"
            [[ "$remote_size" == "$local_size" ]]
            [[ "$remote_digest" == "$local_digest" ]]
          done

      - name: Publish and require GitHub immutability
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          gh release edit "$tag" --draft=false --prerelease --latest=false

          immutable="false"
          for attempt in {1..15}; do
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
            [[ "$(jq -r '.draft' <<< "$release_json")" == "false" ]]
            immutable="$(jq -r '.immutable // false' <<< "$release_json")"
            [[ "$immutable" == "true" ]] && break
            sleep 2
          done
          if [[ "$immutable" != "true" ]]; then
            echo "Release was published, but GitHub did not report it as immutable." >&2
            exit 1
          fi

          echo "Published immutable release: $(jq -r '.html_url' <<< "$release_json")"

      - name: Download and byte-verify the immutable release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d "$RUNNER_TEMP/release-download.XXXXXX")"
          gh release download "$RELEASE_TAG" --dir "$verify_dir"

          local_count="$(find "$RUNNER_TEMP/release-assets" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')"
          downloaded_count="$(find "$verify_dir" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')"
          [[ "$local_count" == "6" && "$downloaded_count" == "$local_count" ]]

          for local_asset in "$RUNNER_TEMP"/release-assets/*; do
            name="$(basename "$local_asset")"
            [[ -f "$verify_dir/$name" ]]
            cmp "$local_asset" "$verify_dir/$name"
          done
          (cd "$verify_dir" && shasum -a 256 -c SHA256SUMS.txt)
