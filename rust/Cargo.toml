[package]
name = "codex-kimi-bridge"
version = "0.2.0-alpha.2"
edition = "2024"
rust-version = "1.85"
description = "Local OpenAI Responses to Kimi Chat Completions bridge for Codex Desktop"
license = "MIT"
repository = "https://github.com/rinranx/codex-kimi-bridge"
keywords = ["codex", "kimi", "responses-api", "bridge"]
categories = ["command-line-utilities", "web-programming::http-server"]

[[bin]]
name = "codex-kimi-bridge"
path = "src/main.rs"

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "1.12.1"
futures-util = "0.3.32"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.23.4", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
